name: CI/CD Pipeline

on:
  push:
    branches: "main"
    paths:
      - 'app-api/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  # ─── Job 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app-api/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: app-api
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: app-api
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─── Job 2: Build AMD64 (for Integration Test) ───────────────────────────
  build-test-image:
    name: Build Test Image (amd64)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./app-api
          file: ./app-api/Dockerfile
          platforms: linux/amd64
          push: false
          tags: app-api:ci-test
          outputs: type=docker,dest=/tmp/app-api.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-api-test-image
          path: /tmp/app-api.tar
          retention-days: 1

  # ─── Job 3: Integration Test ──────────────────────────────────────────────
  integration-test:
    name: Integration Test (CRUD)
    runs-on: ubuntu-latest
    needs: build-test-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-api-test-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/app-api.tar

      - name: Start services
        working-directory: app-api
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          echo "Waiting for app-api to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/healty > /dev/null 2>&1; then
              echo "App is ready after $((i * 2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "App failed to start"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
              exit 1
            fi
            sleep 2
          done

      - name: Run CRUD integration tests
        run: |
          set -e
          BASE="http://localhost:8080/api/v1"
          PASS=0
          FAIL=0

          check() {
            local name="$1" actual="$2" expected="$3"
            if echo "$actual" | grep -qE "$expected"; then
              echo "  ✅ $name"
              PASS=$((PASS + 1))
            else
              echo "  ❌ $name"
              echo "     Got: $actual"
              FAIL=$((FAIL + 1))
            fi
          }

          echo ""
          echo "── CREATE ──"
          RES=$(curl -sf -X POST "$BASE/note" \
            -H "Content-Type: application/json" \
            -d '{"title":"CI Test Note","content":"Hello from GitHub Actions"}')
          check "POST valid note → success:true" "$RES" '"success":true'
          NOTE_ID=$(echo "$RES" | grep -o '"note_id":"[^"]*"' | cut -d'"' -f4)
          echo "     Created ID: $NOTE_ID"

          RES=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/note" \
            -H "Content-Type: application/json" \
            -d '{"title":"","content":"no title"}')
          check "POST empty title → 4xx" "$RES" "^4"

          echo ""
          echo "── READ ──"
          RES=$(curl -sf "$BASE/note/$NOTE_ID")
          check "GET existing note → has data" "$RES" '"data":'

          RES=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/note/00000000-0000-0000-0000-000000000000")
          check "GET non-existent note → 404" "$RES" "404"

          echo ""
          echo "── LIST ──"
          RES=$(curl -sf "$BASE/lists?limit=10")
          check "GET list → has data array" "$RES" '"data":\['

          NEXT_ID=$(echo "$RES" | grep -o '"next_id":"[^"]*"' | cut -d'"' -f4)
          if [ -n "$NEXT_ID" ] && [ "$NEXT_ID" != "null" ]; then
            RES2=$(curl -sf "$BASE/lists?limit=10&next_id=$NEXT_ID")
            check "GET list with cursor → succeeds" "$RES2" '"data":\['
          else
            echo "  ⏭  Cursor test skipped (only 1 page of data)"
            PASS=$((PASS + 1))
          fi

          echo ""
          echo "── UPDATE (PUT) ──"
          RES=$(curl -sf -X PUT "$BASE/note/$NOTE_ID" \
            -H "Content-Type: application/json" \
            -d '{"title":"Updated Title","content":"Updated content"}')
          check "PUT existing note → success:true" "$RES" '"success":true'

          RES=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "$BASE/note/00000000-0000-0000-0000-000000000000" \
            -H "Content-Type: application/json" \
            -d '{"title":"Ghost","content":"Ghost content"}')
          check "PUT non-existent note → 404" "$RES" "404"

          echo ""
          echo "── UPDATE (PATCH) ──"
          RES=$(curl -sf -X PATCH "$BASE/note/$NOTE_ID" \
            -H "Content-Type: application/json" \
            -d '{"title":"Patched Title"}')
          check "PATCH existing note → success:true" "$RES" '"success":true'

          RES=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$BASE/note/00000000-0000-0000-0000-000000000000" \
            -H "Content-Type: application/json" \
            -d '{"title":"Ghost"}')
          check "PATCH non-existent note → 404" "$RES" "404"

          echo ""
          echo "── DELETE ──"
          RES=$(curl -sf -X DELETE "$BASE/note/$NOTE_ID")
          check "DELETE existing note → success:true" "$RES" '"success":true'

          RES=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$BASE/note/$NOTE_ID")
          check "DELETE already-deleted note → 404" "$RES" "404"

          echo ""
          echo "══════════════════════════════"
          echo "  Results: ✅ $PASS passed  ❌ $FAIL failed"
          echo "══════════════════════════════"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Dump logs on failure
        if: failure()
        working-directory: app-api
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Teardown services
        if: always()
        working-directory: app-api
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ─── Job 4: Parallel Native Builds (by-digest) ───────────────────────────
  build-matrix:
    name: Build Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: integration-test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app-api
          file: ./app-api/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/ernestoyoofi/learning-kubernetes,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ─── Job 5: Merge Multi-Arch Manifest ─────────────────────────────────────
  push-manifest:
    name: Merge and Push Manifest (Multi-Arch)
    runs-on: ubuntu-latest
    needs: build-matrix

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/ernestoyoofi/learning-kubernetes:latest"
          DIGESTS=""
          for f in *; do
            DIGESTS="$DIGESTS ghcr.io/ernestoyoofi/learning-kubernetes@sha256:$f"
          done
          echo "Merging digests:$DIGESTS"
          docker buildx imagetools create -t $IMAGE $DIGESTS

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ghcr.io/ernestoyoofi/learning-kubernetes:latest
